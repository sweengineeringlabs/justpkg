name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Verify CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.sha }}"
          passed=$(gh api "repos/${{ github.repository }}/commits/${sha}/check-runs" \
            --jq '[.check_runs[] | select(.name == "Test (ubuntu-latest)") | .conclusion] | any(. == "success")')
          if [[ "$passed" != "true" ]]; then
            echo "error: CI (Test ubuntu-latest) has not passed on commit ${sha}"
            echo "hint: wait for CI to be green on dev before pushing a release tag"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Checkout sibling path-deps
        shell: bash
        env:
          CI_GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
        run: |
          SHALLOW_ROOT="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
          cd "$SHALLOW_ROOT"
          git clone --depth 1 --branch main \
            "https://x-access-token:${CI_GIT_TOKEN}@github.com/sweengineeringlabs/justcas.git" \
            justcas
          git clone --depth 1 --branch dev \
            "https://x-access-token:${CI_GIT_TOKEN}@github.com/sweengineeringlabs/filesystem.git" \
            filesystem

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets

      - name: test
        run: cargo test --all-targets

  build:
    name: Build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset: pkg-x86_64-unknown-linux-musl
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: pkg-x86_64-pc-windows-msvc.exe

    steps:
      - uses: actions/checkout@v4

      - name: Checkout sibling path-deps
        shell: bash
        env:
          CI_GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
        run: |
          SHALLOW_ROOT="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
          cd "$SHALLOW_ROOT"
          git clone --depth 1 --branch main \
            "https://x-access-token:${CI_GIT_TOKEN}@github.com/sweengineeringlabs/justcas.git" \
            justcas
          git clone --depth 1 --branch dev \
            "https://x-access-token:${CI_GIT_TOKEN}@github.com/sweengineeringlabs/filesystem.git" \
            filesystem

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: >
          cargo build --release --locked
          --target ${{ matrix.target }}
          -p swe_justpkg_cli

      - name: Rename binary (Linux)
        if: runner.os == 'Linux'
        run: |
          cp target/${{ matrix.target }}/release/pkg ${{ matrix.asset }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          copy target\${{ matrix.target }}\release\pkg.exe ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Verify artifacts
        run: ls -la pkg-*

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: pkg-*
          generate_release_notes: true
          fail_on_unmatched_files: true
