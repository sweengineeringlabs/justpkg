[workspace]
resolver = "2"
members = [
    "main/features/config",
    "main/features/pkg",
    "main/features/nix",
    "main/features/rootfs",
    "main/features/cli",
    "main/features/vminit",
    "main/features/resolve",
]

[workspace.package]
edition    = "2021"
license    = "Apache-2.0"
repository = "https://github.com/sweengineeringlabs/justpkg"
homepage   = "https://github.com/sweengineeringlabs/justpkg"
authors    = ["SWE Engineering Labs"]
rust-version = "1.75"

[workspace.dependencies]
# ── Internal ──────────────────────────────────────────────────────────────
justpkg-config  = { path = "main/features/config",  package = "swe_justpkg_config"  }
justpkg-pkg     = { path = "main/features/pkg",     package = "swe_justpkg_pkg"     }
justpkg-nix     = { path = "main/features/nix",     package = "swe_justpkg_nix"     }
justpkg-resolve = { path = "main/features/resolve", package = "swe_justpkg_resolve" }
justpkg-rootfs  = { path = "main/features/rootfs",  package = "swe_justpkg_rootfs"  }
justpkg-vminit  = { path = "main/features/vminit",  package = "swe_justpkg_vminit"  }

# ── Edge framework
edge-domain        = { git = "ssh://git@github.com/sweengineeringlabs/edge.git", tag = "v0.6.0", package = "edge-domain" }
edge-configbuilder = { git = "ssh://git@github.com/sweengineeringlabs/edge.git", tag = "v0.6.0", package = "swe-edge-configbuilder" }

# ── Cross-repo siblings ───────────────────────────────────────────────────
# Content-addressed storage primitive. justpkg stores every fetched blob
# (narinfo, compressed NAR) in the CAS keyed by its SHA-256 digest.
# CDN is only hit on a cache miss; integrity is verified on every read.
cas = { git = "ssh://git@github.com/sweengineeringlabs/justcas.git", tag = "v0.1.0", package = "swe_justcas_cas" }

# ext4 image reader — used by `justpkg verify-image` to probe binaries.
ext4 = { git = "ssh://git@github.com/sweengineeringlabs/filesystem.git", tag = "v0.2.4", package = "swe_fs_ext4_ext4" }

# ── External ──────────────────────────────────────────────────────────────
thiserror  = "2"
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
clap       = { version = "4", features = ["derive"] }
ureq       = { version = "2", features = ["native-tls"] }
sha2       = "0.10"
hex        = "0.4"
flate2     = "1"
xz2        = "0.1"
zstd       = "0.13"
bzip2      = "0.4"
tar        = "0.4"
tempfile   = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
